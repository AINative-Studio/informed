name: CI

# Story 1.1: every push and PR runs every test suite; a red build blocks merge.
# Backend and frontend run as parallel jobs with dependency caching to keep the
# whole pipeline well under the 10-minute budget.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# A new push supersedes an in-flight run on the same ref, except on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: Backend (pytest + pytest-bdd)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check . && ruff format --check .

      # -rxX lists the pending (xfailed) PRD scenarios with the story that will
      # implement each one, so the shared step library's backlog stays visible.
      - name: Unit and BDD tests
        run: pytest -rxX --cov=app --cov-report=term-missing

      # Story 12.5: unapproved taxonomy/stance wording blocked from release.
      # Runs app.panel_review.gate.check_panel_gate against a self-contained
      # in-memory fixture (seeded, grandfathered, then self-checked with a
      # sabotage row that MUST be caught) — no ZeroDB credentials needed, so
      # this runs on every push/PR and proves the gate's pass AND fail paths
      # are both sound. Checking the real, live panel_reviews ledger needs
      # live credentials this workflow does not have; see
      # scripts/check_panel_gate.py's module docstring for the --live mode
      # and the deployment-readiness gap, which matches
      # scheduled-jobs.yml's documented pattern for the same limitation.
      - name: Panel gate check (story 12.5)
        run: python scripts/check_panel_gate.py

  frontend:
    name: Frontend (Vitest + Playwright/Cucumber)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Unit tests (Vitest + React Testing Library)
        run: npm test

      # Cache the browser binary: downloading Chromium is the slowest step here.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: BDD tests (Playwright + Cucumber)
        run: npm run test:bdd

  # Single required status check for branch protection: it fails if any suite
  # above failed, was cancelled or was skipped.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()
    steps:
      - name: Verify every suite passed
        run: |
          echo "backend:  ${{ needs.backend.result }}"
          echo "frontend: ${{ needs.frontend.result }}"
          if [[ "${{ needs.backend.result }}" != "success" || "${{ needs.frontend.result }}" != "success" ]]; then
            echo "::error::A test suite did not pass; blocking merge."
            exit 1
          fi
          echo "All suites passed."
