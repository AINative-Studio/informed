[project]
name = "informed-api"
version = "0.1.0"
description = "Informed — interest-aligned voter intelligence API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
    # Story 14.1: AES-256-GCM and HKDF for voter-profile envelope encryption.
    # The standard library has HMAC and PBKDF2 but no AEAD cipher, and a
    # hand-rolled one is not a thing to ship for special-category data.
    "cryptography>=43.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-bdd>=8.1",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
bdd_features_base_dir = "tests/features"
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
# Pinned so `ruff format --check` in CI agrees with local runs.
quote-style = "double"
indent-style = "space"
