# and trimmed: only the `id.bioguide`, `id.lis`, `id.govtrack`, `name` and
# `terms` keys this crosswalk reads are kept, and only seven records, so the
# fixture stays readable. Every `id.lis` / `id.bioguide` pair below is the real
# pair the live file carries -- the first draft of this fixture hand-typed
# three of them wrong (it had S313 as Barrasso, when live S313 is Sanders and
# Barrasso is S317), which is exactly the class of error a fixture asserting
# real-world id pairs must not contain. Regenerate it from the live file
# rather than editing a pair by hand.
#
# `terms` is trimmed to each record's last three terms, which is all the
# "latest term type" selection reads, and keeps a long-serving senator's
# twelve-term history from dominating the file.
#
# Shapes the tests need, and which record provides each:
#
#   * Blackburn (B001243) has a `rep` term in her kept history and a current
#     `sen` term -- the crosswalk reads the LAST term's `type`, not any
#     term's, and this record is what proves a former representative now
#     serving in the Senate still counts as a sitting senator.
#   * Alsobrooks (A000382) is single-term, and her LIS id S428 is the one
#     that appears in story 8.1's real live roll-call XML.
#   * Pelosi (P000197) is a House member carrying no `id.lis` at all --
#     exactly the ~439 records of the live file that are correctly NOT part
#     of this crosswalk. Present so the fixture proves the crosswalk filters
#     by the roster's own last-term `type` rather than by "has a lis id",
#     which would be circular.
#
# Nothing here is voter data.

