# A six-senator slice of congress-legislators' `legislators-current.yaml`,
# in the source's exact shape (story 8.2).
#
# Captured live 2026-10-19 from
# https://raw.githubusercontent.com/unitedstates/congress-legislators/main/legislators-current.yaml
# and trimmed: only the `id`, `name` and `terms` keys this crosswalk reads are
# kept, and only six records, so the fixture stays readable. Every `id.lis` /
# `id.bioguide` pair below is the real pair the live file carries.
#
# The sixth record (Scott) deliberately has a House term in its history as
# well as its current `sen` term -- the crosswalk's "is this a sitting
# senator" test reads the LAST term's `type`, not any term's, and this record
# is what proves it (a former representative now serving in the Senate must
# still be counted as a sitting senator).
#
# Nothing here is voter data.

