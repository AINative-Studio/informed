# A small, realistic subset of unitedstates/congress-legislators'
# legislators-current.yaml, in the exact shape the live file publishes
# (confirmed against the live file during story 2.2 — see
# app/ingest/legislators.py's module docstring). Used by CI so the backend
# suite never depends on GitHub being reachable; the live file itself is only
# fetched by scripts/load_legislators.py and the live verification script.
#
# Three real legislators, chosen to exercise distinct paths:
#   - C000127 (Maria Cantwell, WA): a senator with a long term history,
#     including a term that straddles into the 118th/119th boundary and one
#     fully inside the 119th.
#   - N000147 (Eleanor Holmes Norton, DC): a non-voting House delegate with
#     district 0 — the real source's convention for an at-large/territorial
#     seat with no numbered congressional district.
#   - S000033 (Bernie Sanders, VT): a senator who caucuses with Democrats but
#     is registered "Independent" — proves the loader does not force a
#     two-party vocabulary onto `party`.
